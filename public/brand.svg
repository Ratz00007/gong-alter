<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="terracotta-grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e88a68"/>
      <stop offset="45%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#b65435"/>
    </linearGradient>
    <linearGradient id="glass-rim" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="ember-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="56" fill="url(#ember-glow)"/>

  <!-- Twin Interlocking Orbital Rings (VALENCE Motif) -->
  <!-- Primary Ring -->
  <ellipse cx="64" cy="64" rx="42" ry="24" transform="rotate(-30 64 64)" stroke="url(#terracotta-grad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Secondary Ring Interlocking -->
  <ellipse cx="64" cy="64" rx="42" ry="24" transform="rotate(30 64 64)" stroke="url(#terracotta-grad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="140 30"/>

  <!-- Nucleus Core (Deal Foresight Node) -->
  <circle cx="64" cy="64" r="9" fill="url(#terracotta-grad)"/>
  <circle cx="64" cy="64" r="14" stroke="url(#glass-rim)" stroke-width="1.5"/>
</svg>
